name: Report

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test-and-report:
    name: Test and publish Allure report
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The hosted platform is a public demo this project does not run. When it
      # fails its health checks, the report comes from the dockerized platform
      # instead of an empty run, and both the run and the report say so. See
      # docs/test-strategy.md.
      - name: Choose the target
        id: target
        shell: bash
        run: |
          live_up() {
            local url status
            while IFS= read -r url; do
              status="$(curl -fsS --max-time 10 "${url%/}/actuator/health" | jq -r '.status')" || return 1
              [ "$status" = UP ] || return 1
            done < <(sed -n 's/^[A-Z]*_URL=//p' .env.example)
          }
          for attempt in 1 2 3; do
            if live_up; then
              echo "name=live" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then sleep 10; fi
          done
          echo "name=local" >> "$GITHUB_OUTPUT"
          echo "::warning::The hosted platform failed its health checks, so this report tests the dockerized platform instead."
      - name: Use the hosted platform
        if: steps.target.outputs.name == 'live'
        run: cp .env.example .env
      - name: Use the dockerized platform
        if: steps.target.outputs.name == 'local'
        run: cp .env.local.example .env.local
      - name: Pull the platform images
        if: steps.target.outputs.name == 'local'
        uses: ./.github/actions/pull-images
      - name: Start the dockerized platform
        if: steps.target.outputs.name == 'local'
        run: npm run docker:up
      - name: Wait for every service to report healthy
        if: steps.target.outputs.name == 'local'
        uses: ./.github/actions/wait-for-platform
      - name: Run the full suite with Allure results
        id: tests
        run: |
          if [ "$TARGET" = local ]; then npm run test:report:local; else npm run test:report; fi
        env:
          TARGET: ${{ steps.target.outputs.name }}
        continue-on-error: true
      - name: Keep the per-test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-report-${{ steps.target.outputs.name }}-${{ github.run_attempt }}
          path: junit.xml
          if-no-files-found: warn
          retention-days: 90
      - name: Tear down the platform
        if: always() && steps.target.outputs.name == 'local'
        run: npm run docker:down
      - name: Name the target in the report
        if: steps.target.outputs.name == 'local'
        run: |
          mkdir -p allure-results
          echo 'Target=local (RBP 2.2 in Docker, because the hosted platform was down)' > allure-results/environment.properties
      - name: Summarise the target
        if: always() && steps.target.outputs.name == 'local'
        run: |
          {
            echo '## Target: `local`, because the hosted platform was down'
            echo
            echo 'This run tested the RBP `2.2` images via docker compose, not the deployed platform, and the published report comes from that run. The defect guards and capability-gated assertions that describe live behaviour skip there, so a green run here is weaker evidence than a green run against live. See [test-strategy.md](docs/test-strategy.md#the-local-target-runs-nightly-not-on-pull-requests).'
          } >> "$GITHUB_STEP_SUMMARY"
      - run: npm run allure:generate
      - uses: actions/upload-pages-artifact@v5
        with:
          path: allure-report
      - id: deploy
        uses: actions/deploy-pages@v5
      - name: Fail the run when the suite was red
        if: steps.tests.outcome == 'failure'
        run: |
          echo "::error::Test suite failed — see the published report at ${{ steps.deploy.outputs.page_url }}"
          exit 1
