name: Mutation

on:
  schedule:
    - cron: '0 6 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stryker:
    name: Mutation testing (unit layer)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Run Stryker against the unit suite
        run: npm run test:mutation

      - name: Record the score in the run summary
        if: always()
        run: |
          if [ -f reports/mutation/mutation.json ]; then
            jq -r '
              [.files[].mutants[].status] as $statuses
              | ($statuses | map(select(. == "Killed" or . == "Timeout")) | length) as $detected
              | ($statuses | map(select(. == "Survived")) | length) as $survived
              | ($statuses | map(select(. == "NoCoverage")) | length) as $uncovered
              | (10000 * $detected / ($detected + $survived + $uncovered) | round / 100) as $score
              | "Mutation score \($score)% · \($detected) detected · \($survived) survived · \($uncovered) without coverage"
            ' reports/mutation/mutation.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Stryker produced no report — the run did not complete" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the mutation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report
          path: reports/mutation/
          if-no-files-found: error
