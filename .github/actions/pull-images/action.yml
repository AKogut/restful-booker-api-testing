name: Pull the compose images
description: Pulls every image a compose stack needs, retrying with a linear backoff so a transient registry error does not fail the run.

inputs:
  compose-files:
    description: Space-separated compose files that define the stack
    required: false
    default: docker-compose.yml
  attempts:
    description: How many times to try the pull before giving up
    required: false
    default: '4'
  backoff:
    description: Seconds added to the wait after each failed attempt
    required: false
    default: '15'

runs:
  using: composite
  steps:
    - shell: bash
      env:
        COMPOSE_FILES: ${{ inputs.compose-files }}
        ATTEMPTS: ${{ inputs.attempts }}
        BACKOFF: ${{ inputs.backoff }}
      run: |
        compose_args=()
        for file in $COMPOSE_FILES; do
          compose_args+=(-f "$file")
        done
        for attempt in $(seq 1 "$ATTEMPTS"); do
          if docker compose "${compose_args[@]}" pull --quiet; then
            echo "images pulled on attempt ${attempt}/${ATTEMPTS}"
            exit 0
          fi
          if [ "$attempt" -lt "$ATTEMPTS" ]; then
            delay=$((attempt * BACKOFF))
            echo "::warning::image pull failed (attempt ${attempt}/${ATTEMPTS}), retrying in ${delay}s"
            sleep "$delay"
          fi
        done
        echo "::error::could not pull the images for ${COMPOSE_FILES} after ${ATTEMPTS} attempts"
        exit 1
